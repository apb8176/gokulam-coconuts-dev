<div class="flex flex-col min-h-screen">
    <!-- Header -->
  <header class="sticky z-50 bg-[#D4B04C] text-white top-0 px-8 py-2 flex justify-between items-center">
    <!-- Logo -->
    <div class="flex items-center space-x-2">
      <div class="gap-4 flex items-center"><img width="60px" height="60px" src="'../../../../../assets/logo.png"><span class="font-semibold text-2xl">GOKULAM COCONUTS</span></div>
    </div>
    <!-- Nav -->
    <nav class="space-x-8 hidden md:flex text-lg font-semibold text-slate-800">
            @for(item of selectedNavItem;track  item) {
                <a [routerLink]="item.navItemRoute" class="hover:text-gray-300">{{ item.navItemLabel }}</a>

            }
                
            <!-- <a routerLink="/" class="hover:text-gray-300">Dashboard</a>
            <a routerLink="/services" class="hover:text-gray-300">Account</a>
            <a routerLink="/about" class="hover:text-gray-300">Posts</a>
            <a routerLink="/login" class="hover:text-gray-300">Logout</a> -->
        </nav>
        <!-- Mobile Menu -->

        @if(showMobileMenu) {
        <div class="md:hidden flex flex-col  text-white px-8 py-4 space-y-2">
             @for(item of selectedNavItem;track  item) {
                <a [routerLink]="item.navItemRoute" class="hover:text-gray-300">{{ item.navItemLabel }}</a>

            }
            <!-- <a routerLink="/" class="hover:text-gray-300">Dashboard</a>
            <a routerLink="/services" class="hover:text-gray-300">Account</a>
            <a routerLink="/about" class="hover:text-gray-300">Posts</a>
            <a routerLink="/login" class="hover:text-gray-300">Logout</a> -->
        </div>
        }
        <button class="md:hidden text-white" (click)="showMobileMenu = !showMobileMenu">
            ☰
        </button>

    </header>

    <!-- Main -->
    <main class="flex-grow bg-[#e7efff]">
        <router-outlet></router-outlet>
    </main>

    <!-- Footer -->
    <footer class="bg-[#D4B04C] text-white text-center py-4">
       © 2025 GOKULAM COCONUTS INTERNATIONAL BUSINESS COMMUNITY. All Rights Reserved.
    </footer>
</div>
