<div>
    @if(showInfo) {
    <ng-content select="[property-details]">
        <form #propertyForm="ngForm" (ngSubmit)="onSubmit(propertyForm)" 
      class="max-w-4xl my-5 mx-auto p-6 bg-white rounded-lg shadow-md space-y-6">

  <!-- SECTION 1: Property Details -->
  <h2 class="text-lg font-semibold text-gray-800 border-b pb-2">Property Details</h2>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label for="type" class="block mb-2 text-sm font-medium text-gray-900">Property Type</label>
      <select id="type" name="type" [(ngModel)]="property.type" required
        class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-2.5 focus:ring-blue-500 focus:border-blue-500">
        <option value="">Select</option>
        <option value="House">House</option>
        <option value="Apartment">Apartment</option>
        <option value="Plot">Plot</option>
        <option value="Commercial">Commercial</option>
      </select>
    </div>
    <div>
      <label for="bhk" class="block mb-2 text-sm font-medium text-gray-900">Type (BHK)</label>
      <select id="bhk" name="bhk" [(ngModel)]="property.bhk"
        class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-2.5">
        <option value="">Select</option>
        <option value="1BHK">1BHK</option>
        <option value="2BHK">2BHK</option>
        <option value="3BHK">3BHK</option>
        <option value="4BHK+">4BHK+</option>
      </select>
    </div>
  </div>
  <div>
    <label for="address" class="block mb-2 text-sm font-medium text-gray-900">Address</label>
    <textarea id="address" name="address" [(ngModel)]="property.address" required
      class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-2.5"></textarea>
  </div>
  <div>
    <label for="location" class="block mb-2 text-sm font-medium text-gray-900">Google Map Location (URL)</label>
    <input type="url" id="location" name="location" [(ngModel)]="property.location"
      placeholder="https://maps.google.com/..."
      class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-2.5" />
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label for="size" class="block mb-2 text-sm font-medium text-gray-900">Size / Dimension (sqft)</label>
      <input type="text" id="size" name="size" [(ngModel)]="property.size" required
        class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-2.5" />
    </div>
    <div>
      <label for="age" class="block mb-2 text-sm font-medium text-gray-900">Building Age (years)</label>
      <input type="number" id="age" name="age" [(ngModel)]="property.age"
        class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-2.5" />
    </div>
  </div>

  <!-- SECTION 2: Owner Details -->
  <h2 class="text-lg font-semibold text-gray-800 border-b pb-2">Owner Details</h2>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label for="ownerName" class="block mb-2 text-sm font-medium text-gray-900">Owner Name</label>
      <input type="text" id="ownerName" name="ownerName" [(ngModel)]="property.ownerName" required
        class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-2.5" />
    </div>
    <div>
      <label for="contact" class="block mb-2 text-sm font-medium text-gray-900">Contact Number</label>
      <input type="tel" id="contact" name="contact" [(ngModel)]="property.contact" required pattern="[0-9]{10}"
        placeholder="10-digit number"
        class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-2.5" />
    </div>
  </div>

  <!-- SECTION 3: Pricing -->
  <h2 class="text-lg font-semibold text-gray-800 border-b pb-2">Pricing</h2>
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <div>
      <label for="price" class="block mb-2 text-sm font-medium text-gray-900">Price (₹)</label>
      <input type="number" id="price" name="price" [(ngModel)]="property.price" required
        class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-2.5" />
    </div>
    <div>
      <label for="maintenance" class="block mb-2 text-sm font-medium text-gray-900">Maintenance Cost (₹)</label>
      <input type="number" id="maintenance" name="maintenance" [(ngModel)]="property.maintenance"
        class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-2.5" />
    </div>
    <div>
      <label for="advance" class="block mb-2 text-sm font-medium text-gray-900">Advance Amount (₹)</label>
      <input type="number" id="advance" name="advance" [(ngModel)]="property.advance"
        class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-2.5" />
    </div>
  </div>

  <!-- SECTION 4: Availability -->
  <h2 class="text-lg font-semibold text-gray-800 border-b pb-2">Availability</h2>
  <div>
    <label for="startDate" class="block mb-2 text-sm font-medium text-gray-900">Available From</label>
    <input type="date" id="startDate" name="startDate" [(ngModel)]="property.startDate" required
      class="bg-gray-50 border border-gray-300 text-sm rounded-lg block w-full p-2.5" />
  </div>

  <!-- SECTION 5: Amenities -->
  <h2 class="text-lg font-semibold text-gray-800 border-b pb-2">Amenities</h2>
  <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
    <label class="flex items-center">
      <input type="checkbox" name="amenities" [(ngModel)]="property.amenities.parking" class="mr-2"> Parking
    </label>
    <label class="flex items-center">
      <input type="checkbox" name="amenities" [(ngModel)]="property.amenities.water" class="mr-2"> Water Supply
    </label>
    <label class="flex items-center">
      <input type="checkbox" name="amenities" [(ngModel)]="property.amenities.lift" class="mr-2"> Lift
    </label>
    <label class="flex items-center">
      <input type="checkbox" name="amenities" [(ngModel)]="property.amenities.power" class="mr-2"> Power Backup
    </label>
    <label class="flex items-center">
      <input type="checkbox" name="amenities" [(ngModel)]="property.amenities.security" class="mr-2"> Security
    </label>
    <label class="flex items-center">
      <input type="checkbox" name="amenities" [(ngModel)]="property.amenities.gym" class="mr-2"> Gym
    </label>
  </div>

  <!-- Submit -->
  <div class="pt-4">
    <button type="submit"
      class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 
      font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center">
      Submit
    </button>
  </div>
</form>

    </ng-content>
    } @else {
    <ng-content select="[gallery]">
        

<div class="grid gap-4 px-5 py-5 lg:grid-cols-5 ">
  <!-- Thumbnails -->
  <div class="order-2 lg:order-1 lg:col-span-1 flex lg:flex-col gap-4 max-h-[70vh] overflow-y-auto">
    <img class="h-auto max-w-full rounded-lg" src="https://flowbite.s3.amazonaws.com/docs/gallery/square/image-1.jpg" alt="">
    <img class="h-auto max-w-full rounded-lg" src="https://flowbite.s3.amazonaws.com/docs/gallery/square/image-2.jpg" alt="">
    <img class="h-auto max-w-full rounded-lg" src="https://flowbite.s3.amazonaws.com/docs/gallery/square/image-3.jpg" alt="">
    <img class="h-auto max-w-full rounded-lg" src="https://flowbite.s3.amazonaws.com/docs/gallery/square/image-4.jpg" alt="">
    <img class="h-auto max-w-full rounded-lg" src="https://flowbite.s3.amazonaws.com/docs/gallery/square/image-5.jpg" alt="">
  </div>

  <!-- Main Image -->
  <div class="order-1 lg:order-2 lg:col-span-4 p-3 max-w-[60vw] ">
    <img class="h-auto max-w-full rounded-lg" src="https://flowbite.s3.amazonaws.com/docs/gallery/featured/image.jpg" alt="">
  </div>
</div>


    </ng-content>
    }
</div>
