<div class="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-black bg-opacity-60 backdrop-blur-sm">
  <div class="relative bg-white p-6 sm:p-8 rounded-xl shadow-2xl max-w-full sm:max-w-md w-full transform transition-all duration-300 border-2 border-[#115930]">
    
    <!-- Close Button -->
    <button (click)="closePopup()" class="absolute top-3 right-3 sm:top-4 sm:right-4 text-[#115930] hover:text-[#0D0D0D] transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>

    <h2 class="text-2xl sm:text-3xl font-extrabold text-[#115930] mb-4 sm:mb-6 text-center pt-2 sm:pt-0">
      Sign in
      <br>
      <span class="text-sm sm:text-base text-[#0D0D0D] font-normal">Access your account</span>
    </h2>

    <form [formGroup]="signinForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label for="username" class="block text-sm font-semibold text-[#0D0D0D] mb-1">Username or Email</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Enter username or email"
          class="w-full px-4 py-2 border border-[#C7D943] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#115930] bg-white text-[#0D0D0D]"
        />
      </div>

      <div class="mb-4">
        <label for="password" class="block text-sm font-semibold text-[#0D0D0D] mb-1">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter password"
          class="w-full px-4 py-2 border border-[#C7D943] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#115930] bg-white text-[#0D0D0D]"
        />
      </div>

      <div class="flex items-center justify-between mb-6">
        <label class="flex items-center text-sm text-[#0D0D0D]">
          <input type="checkbox" formControlName="rememberMe" class="mr-2 accent-[#115930]" /> Remember me
        </label>
        <a href="#" class="text-sm text-[#115930] hover:text-[#0D0D0D]">Forgot password?</a>
      </div>

      <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4 text-sm" role="alert">
        <strong class="font-bold">Error:</strong> <span class="ml-1">{{ errorMessage }}</span>
      </div>

      <button
        type="submit"
        class="w-full bg-[#115930] text-[#F2D479] py-3 rounded-lg font-bold text-lg hover:bg-[#0D0D0D] transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-[#C7D943]"
        [disabled]="signinForm.invalid"
      >
        Sign In
      </button>
    </form>
  </div>
</div>
