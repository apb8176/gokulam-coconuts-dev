<div class="flex flex-col min-h-screen">
  <!-- Header -->
  <header class="sticky z-50 bg-[#737687] text-white top-0 px-8 py-4 flex justify-between items-center">
    <!-- Logo -->
    <div class="flex items-center space-x-2">
      <div class="w-6 h-6 bg-gray-300 rounded-full"></div>
    </div>
    <!-- Nav -->
    <nav class="space-x-8 hidden md:flex">
      <a routerLink="/" class="hover:text-gray-300">Home</a>
      <a routerLink="/services" class="hover:text-gray-300">Services</a>
      <a routerLink="/about" class="hover:text-gray-300">About Us</a>
      <a (click)="login()" class="hover:text-gray-300">Login / Register</a>

      <a (click)="logout()" class="hover:text-gray-300">Logout</a>

    </nav>
    <!-- Mobile Menu -->

    @if(showMobileMenu) {
    <div class="md:hidden bg-[#2f3e30] text-white px-8 py-4 space-y-2">
      <a routerLink="/" class="block hover:text-gray-300">Home</a>
      <a routerLink="/services" class="block hover:text-gray-300">Services</a>
      <a routerLink="/about" class="block hover:text-gray-300">About Us</a>
      <a (click)="login()" class="block hover:text-gray-300">Login / Register</a>

      <a (click)="logout()" class="hover:text-gray-300">Logout</a>
    </div>
    }
    <button class="md:hidden text-white" (click)="showMobileMenu = !showMobileMenu">
      ☰
    </button>

  </header>

  <!-- Main -->
  <main class="flex-grow bg-[#e7efff]">
    @if(isAuthenticated){
    <div>

      <br />

      Is Authenticated: {{ isAuthenticated }}

      <br />
      userData
      <pre>{{ userData$ | async | json }}</pre>

      <br />
    </div>
    }

    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="bg-[#737687] text-white text-center py-4">
    © 2025 Company Name. All Rights Reserved.
  </footer>
</div>
